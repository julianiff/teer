[package]
name = "teer"
version = "0.4.0"
edition = "2024"
description = "teer: the essence of every revision. Semantic code review in the terminal."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/julianiff/teer"
homepage = "https://github.com/julianiff/teer"
keywords = ["code-review", "tui", "git", "claude", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

# The `teer` library and binary are the root package; `desktop/src-tauri`
# is Teer.app, built on the library without the terminal front end.
[workspace]
members = [".", "desktop/src-tauri"]

[[bin]]
name = "teer"
path = "src/main.rs"
# The binary is the terminal front end.
required-features = ["tui"]

[lib]
name = "teer"
path = "src/lib.rs"

[features]
default = ["tui"]
# The terminal front end (`src/tui`, `src/cli.rs` and the `teer` binary).
# Off, the library has no terminal crates: the review core and
# `session` only, for another front end.
tui = ["dep:crossterm", "dep:ratatui"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
directories = "6"
futures = "0.3"
# Model APIs (Anthropic, OpenAI-compatible): rustls with the system's trust store.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "system-proxy"] }
# The repository tools teer gives a model API: glob patterns and grep.
globset = "0.4.21"
regex = "1.13"
ratatui = { version = "0.30", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Splits the `editor` command into words (quotes keep spaces); no shell runs it.
shlex = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
# `teer setup` writes its choices into the config and keeps the rest of it.
toml_edit = "0.25"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"

[dev-dependencies]
insta = "1"

# The integration tests drive the terminal front end.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["tui"]

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
