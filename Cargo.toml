[package]
name = "teer"
version = "0.1.0"
edition = "2024"
description = "teer: the essence of every revision. Semantic code review in the terminal."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/julianiff/teer"
homepage = "https://github.com/julianiff/teer"
keywords = ["code-review", "tui", "git", "claude", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "teer"
path = "src/main.rs"

[lib]
name = "teer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
# Model APIs (Anthropic, OpenAI-compatible): rustls with the system's trust store.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "system-proxy"] }
# The repository tools teer gives a model API: glob patterns and grep.
globset = "0.4.21"
regex = "1.13"
# Only to hand raw pixels to ratatui-image; no codecs.
image = { version = "0.25", default-features = false }
ratatui = "0.30"
# The Visualize picture inside the terminal (Kitty, iTerm2, Sixel); no libchafa.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
# SVG to pixels for that picture: text with system fonts, no embedded images.
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Splits the `editor` command into words (quotes keep spaces); no shell runs it.
shlex = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
# `teer setup` writes its choices into the config and keeps the rest of it.
toml_edit = "0.25"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"

[dev-dependencies]
insta = "1"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
