[package]
name = "teer-desktop"
version = "0.2.0"
edition = "2024"
description = "Teer.app: teer's semantic code review in a window."
license = "Apache-2.0"
repository = "https://github.com/julianiff/teer"
publish = false

# cargo-dist releases the CLI; the app has its own release job.
[package.metadata.dist]
dist = false

[[bin]]
name = "teer-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The review core, without the terminal front end.
teer = { path = "../..", default-features = false }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
